# Project names should contain only lowercase characters and underscores. 
name: 'dfds_dbt_practice'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  # Your project models
  dfds_dbt_practice:
    stage_layer:
      +materialized: view
    mart_layer:
      +materialized: table

  # Disable dbt_project_evaluator from running automatically
  dbt_project_evaluator:
    +enabled: false

# Disable dbt_project_evaluator tests from running
tests:
  dbt_project_evaluator:
    +enabled: false