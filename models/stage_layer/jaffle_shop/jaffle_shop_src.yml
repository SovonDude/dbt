# all sources must be defined to track lineage of models
version: 2

# the below command can be used to check all the sources
#{{ codegen.generate_source(schema_name= 'jaffle_shop', database_name= 'DFDS_DBT_DB') }}


sources:
  - name: jaffle_shop
    database: dfds_dbt_db
    schema: jaffle_shop
    config:
      loaded_at_field: _etl_loaded_at
      freshness:  # can be done in the model as well
        warn_after: 
          count: 12
          period: hour
        error_after: 
          count: 1
          period: day
    tables:
      - name: customers 
        config:
          freshness: null
      - name: orders      
            