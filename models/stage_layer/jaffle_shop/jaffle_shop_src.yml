# all sources must be defined to track lineage of models
version: 2

sources:
  - name: jaffle_shop
    database: dfds_dbt_db
    schema: jaffle_shop
    config:
      loaded_at_field: _etl_loaded_at
      freshness:  # can be done in the model as well
        warn_after: 
          count: 12
          period: hour
        error_after: 
          count: 1
          period: day
    tables:
      - name: customers 
        config:
          freshness: null
      - name: orders      
            